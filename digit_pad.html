<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MNIST Digit Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=Chivo+Mono:wght@400;500&display=swap">
<style>
/* Layout: drawing pad on the left, "what the model sees" on the right; stacks to one column on phones */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --fg: #161a22;
  --muted: #5b6372;
  --line: #d5d9e1;
  --accent: #2b56c9;
  --accent-fg: #ffffff;
  --ink-bg: #000000;           /* the image itself: always black, like MNIST */
  --font-ui: "Chivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --surface: #1a1d24; --fg: #e7e9ee; --muted: #9aa2b0;
    --line: #2d323c; --accent: #86a6ff; --accent-fg: #0c1020; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 16px 40px;
  display: grid;
  gap: 20px;
}
header { display: grid; gap: 4px; }
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(1.5rem, 3.2vw, 2.1rem);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); max-width: 64ch; }

.panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 760px) {
  .panels { grid-template-columns: minmax(0, 1fr); }
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 14px;
  min-width: 0;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
}
.dims { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

canvas.square {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1;
  background: var(--ink-bg);
  border-radius: 6px;
}
#pad { touch-action: none; cursor: crosshair; }
#preview { image-rendering: pixelated; cursor: cell; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .check label { font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }

input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { margin-top: 4px; accent-color: var(--accent); }

input[type="text"] {
  font: inherit;
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  width: 100%;
  min-width: 0;
}

.btn {
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:focus-visible, input:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.readout {
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 2.6em;
  overflow-wrap: anywhere;
}
.file-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.file-row img {
  width: 56px;
  height: 56px;
  image-rendering: pixelated;
  background: var(--ink-bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  flex: none;
}
.save-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 420px) { .save-row { grid-template-columns: minmax(0, 1fr); } }
#status { font-size: 14px; min-height: 1.5em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MNIST Digit Pad</h1>
    <p>Draw one digit. It saves as a 28 × 28 PNG with a white digit on a black background, the same format as the MNIST images the model trained on.</p>
  </header>

  <div class="panels">
    <section class="panel" aria-labelledby="pad-label">
      <div class="panel-head">
        <span class="label" id="pad-label">Draw here</span>
        <span class="dims">drawn at 280 × 280</span>
      </div>
      <canvas id="pad" class="square" aria-label="Drawing pad. Draw a digit with the mouse, a finger or a pen."></canvas>
      <div class="row">
        <button class="btn" id="undo" type="button">Undo</button>
        <button class="btn" id="clear" type="button">Clear</button>
        <span class="hint" id="pad-note"></span>
      </div>
      <div class="field">
        <label for="brush">Brush: <span id="brush-val"></span></label>
        <input type="range" id="brush" min="8" max="40" step="1" value="22">
      </div>
      <div class="check">
        <input type="checkbox" id="center" checked>
        <label for="center">Center like MNIST: shrink the digit to fit a 20 × 20 box in the middle, with a 4-pixel black border</label>
      </div>
    </section>

    <section class="panel" aria-labelledby="preview-label">
      <div class="panel-head">
        <span class="label" id="preview-label">What the model sees</span>
        <span class="dims">28 × 28 = 784 pixels</span>
      </div>
      <canvas id="preview" class="square" tabindex="0" aria-label="The 28 by 28 version of your drawing, enlarged. Point at a pixel to see its value."></canvas>
      <div class="readout" id="readout" aria-live="polite"></div>
      <div class="file-row">
        <img id="file-img" alt="The 28 by 28 file at twice its real size">
        <span class="hint">The actual file, shown at 2× size.</span>
      </div>
      <div class="save-row">
        <div class="field">
          <label for="filename">File name</label>
          <input type="text" id="filename" value="digit.png" spellcheck="false" autocomplete="off">
        </div>
        <button class="btn primary" id="save" type="button">Save to inputs/</button>
      </div>
      <div id="status" role="status"></div>
    </section>
  </div>
</div>

<script>
(() => {
  const SIZE = 280;          // drawing resolution
  const OUT = 28;            // MNIST resolution
  const CELL = SIZE / OUT;   // 10 drawing pixels per output pixel
  const BOX = 200;           // 20 x 20 output pixels, at drawing resolution
  const MEAN = 0.1307, STD = 0.3081;

  const pad = document.getElementById('pad');
  const pctx = pad.getContext('2d', { willReadFrequently: true });
  pad.width = pad.height = SIZE;

  const preview = document.getElementById('preview');
  const vctx = preview.getContext('2d');
  preview.width = preview.height = SIZE;

  const work = document.createElement('canvas');
  work.width = work.height = SIZE;
  const wctx = work.getContext('2d', { willReadFrequently: true });

  const out = document.createElement('canvas');
  out.width = out.height = OUT;
  const octx = out.getContext('2d');

  const brush = document.getElementById('brush');
  const brushVal = document.getElementById('brush-val');
  const center = document.getElementById('center');
  const readout = document.getElementById('readout');
  const padNote = document.getElementById('pad-note');
  const fileImg = document.getElementById('file-img');
  const filename = document.getElementById('filename');
  const saveBtn = document.getElementById('save');
  const status = document.getElementById('status');

  let grid = new Uint8ClampedArray(OUT * OUT);
  let drawing = false;
  let last = null;
  const undoStack = [];
  const READOUT_IDLE = 'Point at a pixel to see its value.';

  // ---------- drawing ----------
  function clearPad() {
    pctx.fillStyle = '#000';
    pctx.fillRect(0, 0, SIZE, SIZE);
  }

  function stroke(a, b) {
    const w = Number(brush.value);
    pctx.fillStyle = '#fff';
    pctx.strokeStyle = '#fff';
    if (a.x === b.x && a.y === b.y) {
      pctx.beginPath();
      pctx.arc(a.x, a.y, w / 2, 0, Math.PI * 2);
      pctx.fill();
      return;
    }
    pctx.lineWidth = w;
    pctx.lineCap = 'round';
    pctx.lineJoin = 'round';
    pctx.beginPath();
    pctx.moveTo(a.x, a.y);
    pctx.lineTo(b.x, b.y);
    pctx.stroke();
  }

  function pointerPos(e) {
    const r = pad.getBoundingClientRect();
    return { x: (e.clientX - r.left) * SIZE / r.width, y: (e.clientY - r.top) * SIZE / r.height };
  }

  function pushUndo() {
    undoStack.push(pctx.getImageData(0, 0, SIZE, SIZE));
    if (undoStack.length > 30) undoStack.shift();
  }

  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pad.setPointerCapture(e.pointerId);
    pushUndo();
    drawing = true;
    last = pointerPos(e);
    stroke(last, last);
    padNote.textContent = '';
    scheduleUpdate();
  });
  pad.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pointerPos(e);
    stroke(last, p);
    last = p;
    scheduleUpdate();
  });
  const endStroke = () => { if (drawing) { drawing = false; scheduleUpdate(); } };
  pad.addEventListener('pointerup', endStroke);
  pad.addEventListener('pointercancel', endStroke);

  function undo() {
    if (!undoStack.length) return;
    pctx.putImageData(undoStack.pop(), 0, 0);
    scheduleUpdate();
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('clear').addEventListener('click', () => {
    pushUndo();
    clearPad();
    padNote.textContent = '';
    status.textContent = '';
    scheduleUpdate();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && document.activeElement !== filename) {
      e.preventDefault();
      undo();
    }
  });

  function showBrush() {
    const v = Number(brush.value);
    brushVal.textContent = `${v} px (about ${(v / CELL).toFixed(1)} px in the 28 × 28 file)`;
  }
  brush.addEventListener('input', showBrush);
  center.addEventListener('change', scheduleUpdate);

  // ---------- 280 x 280 drawing -> 28 x 28 grid ----------
  function computeGrid() {
    const src = pctx.getImageData(0, 0, SIZE, SIZE).data;
    let minX = SIZE, minY = SIZE, maxX = -1, maxY = -1;
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (src[(y * SIZE + x) * 4] > 8) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    wctx.fillStyle = '#000';
    wctx.fillRect(0, 0, SIZE, SIZE);
    if (maxX >= 0) {
      if (center.checked) {
        const w = maxX - minX + 1, h = maxY - minY + 1;
        const s = BOX / Math.max(w, h);
        const dw = w * s, dh = h * s;
        wctx.imageSmoothingEnabled = true;
        wctx.imageSmoothingQuality = 'high';
        wctx.drawImage(pad, minX, minY, w, h, (SIZE - dw) / 2, (SIZE - dh) / 2, dw, dh);
      } else {
        wctx.drawImage(pad, 0, 0);
      }
    }

    // Average each 10 x 10 block into one output pixel (0 = black, 255 = white).
    const d = wctx.getImageData(0, 0, SIZE, SIZE).data;
    const g = new Uint8ClampedArray(OUT * OUT);
    for (let gy = 0; gy < OUT; gy++) {
      for (let gx = 0; gx < OUT; gx++) {
        let sum = 0;
        for (let y = gy * CELL; y < (gy + 1) * CELL; y++) {
          for (let x = gx * CELL; x < (gx + 1) * CELL; x++) {
            sum += d[(y * SIZE + x) * 4];
          }
        }
        g[gy * OUT + gx] = Math.round(sum / (CELL * CELL));
      }
    }
    return g;
  }

  function renderPreview() {
    for (let i = 0; i < OUT * OUT; i++) {
      const v = grid[i];
      vctx.fillStyle = `rgb(${v},${v},${v})`;
      vctx.fillRect((i % OUT) * CELL, Math.floor(i / OUT) * CELL, CELL, CELL);
    }
    // pixel grid
    vctx.strokeStyle = 'rgba(140,150,170,0.22)';
    vctx.lineWidth = 1;
    vctx.beginPath();
    for (let k = 1; k < OUT; k++) {
      const p = k * CELL + 0.5;
      vctx.moveTo(p, 0); vctx.lineTo(p, SIZE);
      vctx.moveTo(0, p); vctx.lineTo(SIZE, p);
    }
    vctx.stroke();
    // MNIST 20 x 20 box
    if (center.checked) {
      vctx.save();
      vctx.setLineDash([6, 5]);
      vctx.strokeStyle = 'rgba(134,166,255,0.75)';
      vctx.lineWidth = 1.5;
      vctx.strokeRect(4 * CELL + 0.5, 4 * CELL + 0.5, 20 * CELL - 1, 20 * CELL - 1);
      vctx.restore();
    }
  }

  function renderFile() {
    const img = octx.createImageData(OUT, OUT);
    for (let i = 0; i < OUT * OUT; i++) {
      const v = grid[i];
      img.data[i * 4] = v;
      img.data[i * 4 + 1] = v;
      img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    fileImg.src = out.toDataURL('image/png');
  }

  let pending = false;
  function scheduleUpdate() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      grid = computeGrid();
      renderPreview();
      renderFile();
    });
  }

  // ---------- pixel readout ----------
  function showPixel(e) {
    const r = preview.getBoundingClientRect();
    const col = Math.min(OUT - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * OUT)));
    const row = Math.min(OUT - 1, Math.max(0, Math.floor((e.clientY - r.top) / r.height * OUT)));
    const v = grid[row * OUT + col];
    const norm = (v / 255 - MEAN) / STD;
    readout.textContent =
      `row ${String(row).padStart(2, ' ')}, col ${String(col).padStart(2, ' ')}  ·  ` +
      `pixel ${String(v).padStart(3, ' ')}  ·  after ToTensor ${(v / 255).toFixed(4)}  ·  after Normalize ${norm.toFixed(4)}`;
  }
  preview.addEventListener('pointermove', showPixel);
  preview.addEventListener('pointerdown', showPixel);
  preview.addEventListener('pointerleave', () => { readout.textContent = READOUT_IDLE; });

  // ---------- saving ----------
  // When served by src/digit_pad.py, the image is posted to /save and written to inputs/.
  // When this file is opened directly (no server), fall back to a normal download.
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  saveBtn.addEventListener('click', () => {
    let name = filename.value.trim() || 'digit.png';
    if (!/\.png$/i.test(name)) name += '.png';
    filename.value = name;
    out.toBlob(async (blob) => {
      if (location.protocol === 'file:') {
        download(blob, name);
        status.textContent = `Downloaded ${name}. To save straight into inputs/, run python3 src/digit_pad.py instead of opening this file directly.`;
        return;
      }
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'image/png', 'X-Filename': name },
          body: blob,
        });
        const result = await res.json();
        if (!res.ok) {
          status.textContent = `Not saved: ${result.error}.`;
          return;
        }
        status.textContent = `Saved ${result.path}. Set image_path in src/predict.py to "${result.path}".`;
      } catch (err) {
        status.textContent = 'Not saved: the digit pad server isn’t running. Start it with python3 src/digit_pad.py.';
      }
    }, 'image/png');
  });

  // ---------- start with an example: a 4 that is open at the top ----------
  function drawExample() {
    clearPad();
    const lines = [
      [{ x: 100, y: 62 }, { x: 88, y: 150 }, { x: 188, y: 150 }],
      [{ x: 168, y: 58 }, { x: 164, y: 226 }],
    ];
    for (const pts of lines) {
      for (let i = 1; i < pts.length; i++) stroke(pts[i - 1], pts[i]);
    }
    padNote.textContent = 'Example 4. Press Clear to draw your own.';
  }

  showBrush();
  readout.textContent = READOUT_IDLE;
  drawExample();
  scheduleUpdate();
})();
</script>
</body>
</html>
